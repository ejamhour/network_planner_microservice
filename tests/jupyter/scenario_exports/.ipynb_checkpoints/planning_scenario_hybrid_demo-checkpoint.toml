[scenario]
working_crs = "EPSG:31982"

[antennas.lte_omni]
kind = "omni"
model = "lte_omni"
gain_dbi = 6.0
height_m = 7.0

[antennas.n2n_omni]
kind = "omni"
model = "n2n_omni"
gain_dbi = 3.0
height_m = 7.0

[interfaces.lte_access]
tech = "lte"
freq_mhz = 400.0
tx_power_dbm = 20.0
antenna_id = "lte_omni"
can_relay = false

[interfaces.n2n_leaf]
tech = "n2n"
freq_mhz = 915.0
tx_power_dbm = 20.0
antenna_id = "n2n_omni"
can_relay = false

[interfaces.n2n_relay]
tech = "n2n"
freq_mhz = 915.0
tx_power_dbm = 23.0
antenna_id = "n2n_omni"
can_relay = true

[devices.tower_lte]
connected = true
can_route = true
rank = 0.0
mount_height_m = 100.0
interfaces = ["lte_access"]

[devices.field_leaf_dual]
connected = false
can_route = false
mount_height_m = 7.0
interfaces = ["lte_access", "n2n_leaf"]

[devices.field_relay_dual]
connected = false
can_route = true
mount_height_m = 7.0
interfaces = ["lte_access", "n2n_relay"]

[metrics.lte]
spec = "lte_tower_node"

[metrics.n2n]
spec = "default"

[instances]
source = "planning_scenario_hybrid_demo.nodes.csv"
format = "csv"
profile_column = "device_profile"

[[net.connectivity]]
kind = "rf"
tech = "lte"
source = "connected"
destination = "unconnected"

[[net.connectivity]]
kind = "rf"
tech = "n2n"
source = "relay"
destination = "any"
degree = 3
limit = 1000.0

[[net.connectivity]]
kind = "internal"
enabled_when_device_can_route = true
metric = 0.0

[[net.candidate_edges]]
src = "saturno:d0:i1"
dst = "woodland:d0:i1"
kind = "rf"
tech = "n2n"
note = "forced candidate, not forced result"
origin = "manual"
