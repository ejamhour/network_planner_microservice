# Exemplo funcional GE mesh: parâmetros ilustrativos, sem calibração de equipamento.
[scenario]
working_crs = "EPSG:31982"

[antennas.ge_mesh_omni]
kind = "omni"
gain_dbi = 3.0
height_m = 7.0
description = "Ganho fixo ilustrativo; validar antena GE do projeto real"

[interfaces.ge_mesh_radio]
tech = "ge_mesh"
freq_mhz = 915.0
tx_power_dbm = 30.0
antenna_id = "ge_mesh_omni"
can_relay = true

[devices.ge_mesh_router]
kind = "router"
connected = false
can_route = true
interfaces = ["ge_mesh_radio"]

[devices.ge_mesh_gateway]
kind = "gateway"
connected = true
can_route = true
rank = 0.0
interfaces = ["ge_mesh_radio"]

[metrics.ge_mesh]
spec = "default"

[instances]
source = "nodes.csv"
format = "csv"
profile_column = "device_profile"

[[net.connectivity]]
kind = "rf"
tech = "ge_mesh"
source = "relay"
destination = "any"
limit = 2200.0
