[mesh]
assume_symmetric_features = true
max_repeaters = 2
max_candidates = 5
segment_threshold = 3.0
search_heuristic = "sector_band"
search_midpoint = true

[mesh.poles]
source = "poles.csv"
format = "csv"
profile_column = "device_profile"

[mesh.network]
parent_candidates = 2
corridor_m = 1500.0
final_degree = 3
