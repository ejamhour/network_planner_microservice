[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cisei_lib"
version = "0.1.0"
description = "Core library for Smart Grid Planning and Geo-based analysis"
authors = [{ name = "Edgard Jamhour" }]
readme = "README.md"
requires-python = ">=3.10"

# ------------------------------------------------------------------
# Package discovery – find cisei_lib in the root folder
# ------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]          # look in the project root
include = ["cisei_lib*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"cisei_lib" = ["resources/**/*"]

# ------------------------------------------------------------------
# Optional extras
# ------------------------------------------------------------------
[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov"
]

# ------------------------------------------------------------------
# (Optional) entry-points – useful if you ever want a CLI
# ------------------------------------------------------------------
# [project.scripts]
# cisei-cli = "cisei_lib.cli:main"




