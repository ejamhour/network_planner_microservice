# Recipe only: the notebook supplies the source project and its saved result.
# Tables merge by key. Lists replace the source list, including connectivity.
[antennas.wisun_mesh_omni]
kind = "omni"
gain_dbi = 3.0
height_m = 7.0
description = "Assumed 3 dBi Wi-SUN mesh omni"

[interfaces.wisun_mesh]
tech = "wisun"
freq_mhz = 915.0
tx_power_dbm = 23.0
antenna_id = "wisun_mesh_omni"
can_relay = true

[devices.lte_wisun_gateway]
kind = "router"
connected = false
can_route = true
interfaces = ["lte_client", "wisun_mesh"]

[devices.wisun_router]
kind = "router"
connected = false
can_route = true
interfaces = ["wisun_mesh"]

[[replacement.rules]]
name = "Upgrade good LTE clients"
profile = "lte_leaf"
rank_lte = 2.0
replace_with = "lte_wisun_gateway"
connected = true
rank = "copy"

[[replacement.rules]]
name = "Move remaining LTE clients to mesh"
profile = "lte_leaf"
replace_with = "wisun_router"
connected = false

[[net.connectivity]]
kind = "rf"
tech = "lte"
source = "connected"
destination = "unconnected"
sector_aware = true

[[net.connectivity]]
kind = "rf"
tech = "wisun"
source = "relay"
destination = "unconnected"
limit = 5000.0
degree = 6

[[net.connectivity]]
kind = "internal"
metric = 0.0

[metrics.wisun]
spec = """# Exploratory symmetric Wi-SUN link-margin routing cost; assumed hardware.
version = 1
result = "metric"
[expressions]
loss_db = "max(0.0, features.fspl) + max(0.0, features.delta_diffra)"
margin_db = "tx.pw + tx.ant_gain + rx.ant_gain - loss_db - params.system_loss_db - params.clutter_allowance_db - params.fade_margin_db - params.required_rx_dbm"
metric = "max(1.0, 2.0 - margin_db / 10.0)"
[parameters]
required_rx_dbm = -105.0
system_loss_db = 3.0
clutter_allowance_db = 6.0
fade_margin_db = 10.0
"""
