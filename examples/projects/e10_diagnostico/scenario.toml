[scenario]
working_crs = "EPSG:31982"

[antennas.ge_radio_1]
kind = "omni"
gain_dbi = 8.15
height_m = 7.0
description = "Antena OMNI original; ganho informado, sem diagrama direcional disponível"
original_type = "OMNI"

[antennas.ge_radio_2]
kind = "omni"
gain_dbi = 14.0
height_m = 7.0
description = "Antena YAGI original; ganho informado, sem diagrama direcional disponível"
original_type = "YAGI"

[antennas.ge_radio_3]
kind = "omni"
gain_dbi = 2.5
height_m = 7.0
description = "Antena OMNI original; ganho informado, sem diagrama direcional disponível"
original_type = "OMNI"

[interfaces.ge_radio_1]
tech = "ge_mesh"
freq_mhz = 900.0
tx_power_dbm = 30.0
antenna_id = "ge_radio_1"
can_relay = true

[interfaces.ge_radio_2]
tech = "ge_mesh"
freq_mhz = 900.0
tx_power_dbm = 30.0
antenna_id = "ge_radio_2"
can_relay = true

[interfaces.ge_radio_3]
tech = "ge_mesh"
freq_mhz = 900.0
tx_power_dbm = 30.0
antenna_id = "ge_radio_3"
can_relay = true

[devices.ge_radio_1]
interfaces = ["ge_radio_1"]
can_route = true
connected = false

[devices.ge_radio_2]
interfaces = ["ge_radio_2"]
can_route = true
connected = false

[devices.ge_radio_3]
interfaces = ["ge_radio_3"]
can_route = true
connected = false

[metrics.ge_mesh]
spec = "version = 1\nresult = \"metric\"\n\n[expressions]\npredicted_rssi_dbm = \"0.0 + (1.0) * (tx.pw) + (1.0) * (tx.ant_gain) + (1.0) * (rx.ant_gain) + (1.114337839919779) * (-features.fspl) + (1.0) * (-features.delta_diffra) + (3.8599562365669438) * (-log10(1.0 + features.vegetation.boundary)) + (3.5389950747179117) * (-log10(1.0 + features.vegetation.fresnel)) + (2.3297748731723593) * (-log10(1.0 + features.vegetation.core)) + (1.940764307389644) * (-log10(1.0 + features.buildings.boundary)) + (1.1953311899967727) * (-log10(1.0 + features.buildings.fresnel)) + (1.0581500710246432) * (-log10(1.0 + features.buildings.core))\"\nmetric = \"max(1.0, 2.0 - (predicted_rssi_dbm - params.required_rssi_dbm) / params.db_per_cost)\"\n\n[parameters]\nrequired_rssi_dbm = -80.0\ndb_per_cost = 10.0\n"

