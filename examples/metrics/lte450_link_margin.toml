# Exploratory LTE 450 bidirectional link-budget score, not a calibrated coverage model.
# Delta diffraction is terrain-only in the features engine (bare-earth DTM).
# Clutter allowance is an assumed reserve; it is not building/foliage prediction.
# Required receive powers must be replaced with equipment/service measurements.
# Client power is explicit because the current metric record has no rx.pw.
version = 1
result = "metric"

[expressions]
path_loss_db = "max(0.0, features.fspl) + max(0.0, features.delta_diffra)"
reserved_loss_db = "params.system_loss_db + params.clutter_allowance_db + params.fade_margin_db"
downlink_rx_dbm = "tx.pw + tx.ant_gain + rx.ant_gain - path_loss_db - params.system_loss_db"
uplink_rx_dbm = "params.client_tx_power_dbm + rx.ant_gain + tx.ant_gain - path_loss_db - params.system_loss_db"
downlink_margin_db = "downlink_rx_dbm - params.client_required_rx_dbm - params.clutter_allowance_db - params.fade_margin_db"
uplink_margin_db = "uplink_rx_dbm - params.cell_required_rx_dbm - params.clutter_allowance_db - params.fade_margin_db"
limiting_margin_db = "min(downlink_margin_db, uplink_margin_db)"
# Cost 2 = zero reserved margin; cost 1 = at least 10 dB remaining.
# Positive costs remain compatible with routing. Poor links are not pruned.
metric = "max(1.0, 2.0 - limiting_margin_db / params.db_per_cost)"

[parameters]
client_tx_power_dbm = 20.0
client_required_rx_dbm = -110.0
cell_required_rx_dbm = -115.0
system_loss_db = 3.0
clutter_allowance_db = 6.0
fade_margin_db = 10.0
db_per_cost = 10.0
