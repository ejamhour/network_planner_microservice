convention:
  azimuth_deg: 0 is antenna boresight; wrap to [0, 360)
  elevation_deg: 0 is boresight/horizon; positive is up
  attenuation_db: relative attenuation from max_gain_dbi
  interpolation: circular in azimuth; piecewise linear in dB

