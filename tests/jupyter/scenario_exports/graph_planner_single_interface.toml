connected = false
can_route = false
interfaces = ["lte_leaf"]

[metrics.lte]
spec = "lte_tower_node"

[instances]
source = "graph_planner_single_interface.nodes.csv"
format = "csv"
profile_column = "device_profile"

[[net.connectivity]]
kind = "rf"
