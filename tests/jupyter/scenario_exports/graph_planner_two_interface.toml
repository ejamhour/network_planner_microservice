[scenario]
working_crs = "EPSG:31982"

[antennas.lte_tower_omni]
kind = "omni"
description = "lte_tower_omni"
gain_dbi = 14.0
height_m = 7.0

[antennas.lte_leaf_omni]
kind = "omni"
description = "lte_leaf_omni"
gain_dbi = 6.0
height_m = 7.0

[antennas.n2n_omni]
kind = "omni"
description = "n2n_omni"
gain_dbi = 3.0
height_m = 7.0

[interfaces.lte_tower]
tech = "lte"
freq_mhz = 400.0
tx_power_dbm = 43.0
antenna_id = "lte_tower_omni"
can_relay = false

[interfaces.lte_leaf]
tech = "lte"
freq_mhz = 400.0
tx_power_dbm = 20.0
antenna_id = "lte_leaf_omni"
can_relay = false

[interfaces.n2n_leaf]
tech = "n2n"
freq_mhz = 915.0
tx_power_dbm = 20.0
antenna_id = "n2n_omni"
can_relay = false

[interfaces.n2n_relay]
tech = "n2n"
freq_mhz = 915.0
tx_power_dbm = 23.0
antenna_id = "n2n_omni"
can_relay = true

[devices.connected_lte_tower]
kind = "tower"
connected = true
can_route = true
rank = 0.0
interfaces = ["lte_tower"]

[devices.lte_leaf_device]
kind = "field"
connected = false
can_route = false
interfaces = ["lte_leaf"]

[devices.dual_lte_n2n_relay]
kind = "field"
connected = false
can_route = true
interfaces = ["lte_leaf", "n2n_relay"]

[metrics.lte]
spec = "lte_tower_node"

[metrics.n2n]
spec = "default"

[instances]
source = "graph_planner_two_interface.nodes.csv"
format = "csv"
profile_column = "device_profile"

[[net.connectivity]]
kind = "rf"
tech = "lte"
source = "connected"
destination = "unconnected"

[[net.connectivity]]
kind = "rf"
tech = "n2n"
source = "relay"
destination = "any"
degree = 3
limit = 1000.0

[[net.connectivity]]
kind = "internal"
enabled_when_device_can_route = true
metric = 0.0
