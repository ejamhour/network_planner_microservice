[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cisei-planning-sdk"
version = "0.1.9"
description = "Notebook client SDK for the CISEI planning microservice"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "tomlkit>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
